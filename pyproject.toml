[project]
name = "round-table-recall"
version = "0.1.0"
description = "A research round table of free models that remembers, on Walrus Memory, which seats and sources it can trust."
requires-python = ">=3.11"
dependencies = ["memwal>=0.2.3", "requests>=2.31"]

[project.scripts]
rtr = "rtr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
